; Limity nahrávání (fotky/videa k zakázkám + 360° fotky produktů) — PHP-FPM čte
; per adresář, změna se projeví do ~5 minut (user_ini cache). Systémový default 2M nestačil.
; 360° prohlídka = až 48 fotek v plném rozlišení v JEDNOM POSTu → post_max_size musí
; pobrat celou sadu (48 × ~10–25 MB) a max_file_uploads být nad počtem souborů.
upload_max_filesize = 64M
post_max_size = 2000M
max_file_uploads = 64
max_input_time = 600
